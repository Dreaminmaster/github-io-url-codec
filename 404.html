<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>正在读取编码网址</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f4f1;color:#171716;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center;padding:24px;box-sizing:border-box}p{color:#6f706a;overflow-wrap:anywhere}.spin{width:34px;height:34px;margin:0 auto 18px;border:3px solid rgba(0,0,0,.12);border-top-color:#171716;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main><div class="spin"></div><h1>正在读取编码网址</h1><p id="message">正在准备目标确认页面……</p></main>
  <script>
    (() => {
      const modes = new Set(["p", "look", "githubio"]);
      const encodedParts = location.pathname.split("/").filter(Boolean);
      const modeIndex = encodedParts.findIndex((part) => modes.has(part));
      if (modeIndex === -1 || modeIndex === encodedParts.length - 1) {
        document.querySelector("#message").textContent = "没有找到有效编码。";
        return;
      }
      const baseParts = encodedParts.slice(0, modeIndex);
      const mode = encodedParts[modeIndex];
      const payload = encodedParts.slice(modeIndex + 1).join("/");
      const basePath = `/${baseParts.length ? `${baseParts.join("/")}/` : ""}`;
      location.replace(`${location.origin}${basePath}#/${mode}/${payload}`);
    })();
  </script>
</body>
</html>
