<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f4f4f1">
  <title>确认访问目标</title>
  <style>
    :root{color-scheme:light dark;--bg:#f4f4f1;--panel:#fff;--text:#171716;--muted:#6f706a;--line:#d9d9d3;--button:#171716;--buttonText:#fff}
    @media(prefers-color-scheme:dark){:root{--bg:#111210;--panel:#1b1c19;--text:#f3f3ef;--muted:#b4b5ae;--line:#353630;--button:#f3f3ef;--buttonText:#171716}}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}.box{width:min(680px,100%);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:clamp(24px,5vw,44px);box-shadow:0 18px 60px rgba(0,0,0,.08)}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}h1{font-size:clamp(30px,6vw,50px);line-height:1.05;margin:12px 0 28px}.host{font-size:clamp(20px,4vw,30px);font-weight:750;margin:0 0 12px;overflow-wrap:anywhere}.target,.note,.status{color:var(--muted);line-height:1.65;overflow-wrap:anywhere}.target{padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.button{display:inline-flex;justify-content:center;align-items:center;min-height:48px;padding:0 20px;border-radius:999px;text-decoration:none;font-weight:700;border:1px solid var(--line);color:var(--text)}.primary{background:var(--button);border-color:var(--button);color:var(--buttonText)}[hidden]{display:none!important}
  </style>
</head>
<body>
  <main class="box">
    <p class="eyebrow">Decoded destination</p>
    <h1 id="title">正在读取编码网址</h1>
    <section id="destination" hidden>
      <p class="host" id="host"></p>
      <p class="target" id="target"></p>
      <p class="note">请确认域名无误后继续。此编码只是外观转换，不是加密。</p>
      <div class="actions">
        <a class="button primary" id="continue" href="#" rel="noopener noreferrer">继续访问</a>
        <a class="button" id="cancel" href="/">返回转换页面</a>
      </div>
    </section>
    <p class="status" id="status">正在解析……</p>
  </main>
  <script>
    (() => {
      "use strict";
      const title = document.querySelector("#title");
      const status = document.querySelector("#status");
      const destination = document.querySelector("#destination");
      const allParts = location.pathname.split("/").filter(Boolean);

      function fail(message) {
        title.textContent = "无法读取编码网址";
        status.textContent = message;
      }

      function inferMode(payload, codec) {
        if (/^[p.]+$/.test(payload)) return codec.MODES.P_RUNS;
        if (/^[pρрᴘ]+$/u.test(payload)) return codec.MODES.LOOKALIKE;
        if (/^(?:github\.io)(?:\.github\.io){0,3}(?:\/(?:github\.io)(?:\.github\.io){0,3})*$/.test(payload)) {
          return codec.MODES.GITHUB_IO;
        }
        throw new Error("无法识别编码类型");
      }

      function loadCodec(basePath, payloadParts) {
        const script = document.createElement("script");
        script.src = `${location.origin}${basePath}codec.js`;
        script.onload = () => {
          try {
            const codec = window.UrlGlyphCodec;
            if (!codec) throw new Error("编码模块未加载");
            const payload = decodeURIComponent(payloadParts.join("/"));
            const mode = inferMode(payload, codec);
            const decoded = codec.decode(payload, mode);
            if (!codec.isSafeHttpUrl(decoded)) throw new Error("解码结果不是 HTTP(S) 网址");
            const parsed = new URL(decoded);
            document.querySelector("#host").textContent = parsed.hostname;
            document.querySelector("#target").textContent = decoded;
            document.querySelector("#continue").href = decoded;
            document.querySelector("#cancel").href = `${location.origin}${basePath}`;
            title.textContent = "确认访问目标";
            status.hidden = true;
            destination.hidden = false;
          } catch (error) {
            fail(error.message || "无法解码此网址。");
          }
        };
        script.onerror = () => {
          if (basePath === "/" && allParts.length > 1) {
            loadCodec(`/${allParts[0]}/`, allParts.slice(1));
          } else {
            fail("无法加载编码模块。");
          }
        };
        document.head.appendChild(script);
      }

      if (!allParts.length) {
        fail("地址中没有找到编码。");
        return;
      }

      loadCodec("/", allParts);
    })();
  </script>
</body>
</html>
